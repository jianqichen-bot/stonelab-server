services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stonelab
      POSTGRES_USER: stonelab
      POSTGRES_PASSWORD: stonelab
    ports:
      - '5432:5432'
    volumes:
      - stonelab_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stonelab -d stonelab']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - stonelab_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stonelab_postgres:
  stonelab_redis:
